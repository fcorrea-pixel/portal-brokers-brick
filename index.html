<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Brokers Brick</title>
</head>
<body>
<p id="cargando" style="font:15px system-ui,sans-serif;padding:24px;color:#555">Cargando portal...</p>
<script>
/* El portal vive en Supabase Storage; esta pagina solo lo carga. */
fetch('https://relpuoxjbrvwugzlztiq.supabase.co/storage/v1/object/public/archivos/app/portal.html?v=' + Date.now(), {cache: 'no-store'})
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (h) { document.open(); document.write(h); document.close(); })
  .catch(function () { document.getElementById('cargando').textContent = 'No se pudo cargar el portal. Recarga la pagina.'; });
</script>
</body>
</html>
